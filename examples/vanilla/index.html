<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>OrbitGraph Progressive Exploration</title>
</head>
<body>
<main>
    <aside class="panel">
        <span class="eyebrow">VANILLA JAVASCRIPT</span>
        <h1>Community Explorer</h1>
        <p>
            Start with one node and load relationship pages as you explore.
        </p>

        <div class="controls">
            <button id="load-neighborhood" type="button">
                Load next relationships
            </button>
            <button id="reset-exploration" type="button">
                Reset exploration
            </button>
            <button id="show-all" type="button">
                Show loaded graph
            </button>
            <button id="analyze-degree" type="button">
                Analyze degree centrality
            </button>
            <button id="analyze-pagerank" type="button">
                Analyze PageRank
            </button>
            <button id="analyze-betweenness" type="button">
                Analyze betweenness
            </button>
            <button id="detect-communities" type="button">
                Detect communities
            </button>
            <button id="clear-visualization" type="button">
                Clear visualization
            </button>
            <button id="export-json" type="button">
                Export visible JSON
            </button>
        </div>

        <section class="status">
            <span class="status-label">Loading</span>
            <strong id="loading-state">Idle</strong>
        </section>

        <section class="status">
            <span class="status-label">Visible data</span>
            <strong id="visible-data">1 node · 0 relationships</strong>
        </section>

        <section class="status">
            <span class="status-label">Analytics</span>
            <strong id="analytics-state">Choose an analysis</strong>
            <div id="analytics-legend" class="analytics-legend" hidden></div>
        </section>

        <p id="message" class="message" aria-live="polite"></p>
    </aside>

    <div id="graph"></div>
</main>

<script type="module" src="/src/main.ts"></script>
</body>
</html>
